[project]
name = "flicsy"
version = "0.1.0"
description = "Flicsy AI commerce agent on ZooWork Managed Agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "moss>=1.14.0",
    "python-dotenv>=1.2.4",
    "stripe>=16.0.0",
    "uvicorn[standard]>=0.54.0",
    "zoowork>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
